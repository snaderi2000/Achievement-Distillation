save_freq: 50

nstep: 512
nproc: 8
nepoch: 250
gamma: 0.95
gae_lambda: 0.65

model_cls: PPODinoModel
model_kwargs:
  hidsize: 1024
  dino_model_name: dino_crafter_vicreg/final/backbone
  dino_image_size: 224
  freeze_backbone: False
  unfreeze_last_n_blocks: 4
  dino_readout_type: cls_attn
  dino_attention_hidden_size: 384
  dense_init_norm_kwargs:
    layer_norm: True

algorithm_cls: PPOAlgorithm
algorithm_kwargs:
  ppo_nepoch: 3
  ppo_nbatch: 32
  clip_param: 0.2
  vf_loss_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  backbone_lr: 1.0e-4
  max_grad_norm: 0.5
