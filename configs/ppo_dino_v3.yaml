save_freq: 50

nstep: 512
nproc: 8
nepoch: 250
gamma: 0.95
gae_lambda: 0.65

model_cls: PPODinoModel
model_kwargs:
  hidsize: 1024
  dino_model_name: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 224
  freeze_backbone: True
  dense_init_norm_kwargs:
    layer_norm: True

algorithm_cls: PPOAlgorithm
algorithm_kwargs:
  ppo_nepoch: 3
  ppo_nbatch: 8
  clip_param: 0.2
  vf_loss_coef: 0.5
  ent_coef: 0.01
  lr: 3.0e-4
  max_grad_norm: 0.5
